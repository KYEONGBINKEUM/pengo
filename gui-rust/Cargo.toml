[package]
name = "psd-publisher"
version = "1.0.13"
edition = "2021"

[dependencies]
eframe = "0.29"
rfd = "0.15"
chrono = "0.4"
ureq = "2"
serde_json = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true

